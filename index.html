<script>
  (function() {
    var root = document.querySelector('.syno-assistant-root');
    if (!root) return;

    var modal = root.querySelector('.syno-modal');
    var bubble = root.querySelector('.syno-bubble-btn');
    var closeBtn = root.querySelector('.syno-modal-close-btn');
    var speechBubble = root.querySelector('.syno-speech-bubble');

    var heyEl = document.getElementById('syno-greeting-hey');
    var msgEl = document.getElementById('syno-greeting-msg');

    if (!modal || !bubble || !closeBtn) return;

    var greetings = [
      { hey: '👋 Hai!', msg: 'Ada apa-apa yang boleh saya bantu?' },
      { hey: '🛒 Hai!', msg: 'Cari laptop atau PC custom? Tanya saya!' },
      { hey: '🔧 Hello!', msg: 'Ada masalah tech? Saya boleh tolong!' },
      { hey: '💻 Hai!', msg: 'Kami jual laptop, PC & banyak lagi – chat dengan saya!' },
      { hey: '🦉 Hoot!', msg: 'Synotech – rakan IT anda. Saya boleh bantu?' },
      { hey: '⚡ Hai!', msg: 'Perlu servis repair? Saya sedia membantu!' },
      { hey: '👋 Selamat datang!', msg: 'Terokai kedai kami – saya boleh pandu anda!' },
      { hey: '🛠️ Hai!', msg: 'Cari upgrade PC atau repair? Jom bincang!' },
      { hey: '💬 Hello!', msg: 'Synotech – penyelesaian IT dipercayai. Tanya apa-apa!' },
      { hey: '🌟 Hai!', msg: 'Baru di kedai kami? Saya boleh bantu cari yang anda perlukan!' }
    ];

    var modalOpened = false;
    var isVisible = false;
    var delayTimer = null;
    var autoDismissTimer = null;
    var reappearTimer = null;
    var modalCloseReappearTimer = null;

    var setRandomGreeting = function() {
      var randomIndex = Math.floor(Math.random() * greetings.length);
      var selected = greetings[randomIndex];
      if (heyEl) heyEl.textContent = selected.hey;
      if (msgEl) msgEl.textContent = selected.msg;
    };

    var openModal = function() {
      if (modal.classList.contains('active')) return;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      modalOpened = true;
      hideSpeechBubble();
      clearAllTimers();
    };

    var closeModal = function() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      modalOpened = false;
      clearTimeout(modalCloseReappearTimer);
      modalCloseReappearTimer = setTimeout(function() {
        if (!modalOpened && !isVisible) {
          showSpeechBubble();
        }
      }, 5000);
    };

    var showSpeechBubble = function() {
      if (modalOpened) return;
      if (speechBubble) {
        setRandomGreeting();
        speechBubble.classList.add('visible');
        isVisible = true;
        clearTimeout(autoDismissTimer);
        autoDismissTimer = setTimeout(function() {
          if (isVisible) {
            hideSpeechBubble();
            scheduleReappear();
          }
        }, 25000);
      }
    };

    var hideSpeechBubble = function() {
      if (speechBubble) {
        speechBubble.classList.remove('visible');
        isVisible = false;
      }
      clearTimeout(autoDismissTimer);
    };

    var dismissSpeechBubble = function() {
      hideSpeechBubble();
      clearAllTimers();
    };

    var scheduleReappear = function() {
      if (modalOpened) return;
      clearTimeout(reappearTimer);
      var randomDelay = Math.floor(Math.random() * 6000) + 12000;
      reappearTimer = setTimeout(function() {
        if (!modalOpened && !isVisible) {
          showSpeechBubble();
        }
      }, randomDelay);
    };

    var clearAllTimers = function() {
      clearTimeout(delayTimer);
      clearTimeout(autoDismissTimer);
      clearTimeout(reappearTimer);
      clearTimeout(modalCloseReappearTimer);
    };

    bubble.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (!modal.classList.contains('active')) {
        openModal();
      }
      if (isVisible) {
        hideSpeechBubble();
        clearAllTimers();
      }
    });

    if (speechBubble) {
      speechBubble.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dismissSpeechBubble();
        openModal();
      });
    }

    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      closeModal();
    });

    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
    });

    delayTimer = setTimeout(function() {
      if (!modalOpened) {
        showSpeechBubble();
      }
    }, 2500);

    window.addEventListener('beforeunload', function() {
      clearAllTimers();
    });

    console.log('🦉 Syno Assistant Bubble – solid iframe background.');
  })();
</script>
